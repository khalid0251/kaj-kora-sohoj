services:
  - type: web
    name: kaj-kora-sohoj
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --timeout 180 --workers 1 --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: AI_INPAINT_PROVIDER
        value: stability
      - key: STABILITY_API_KEY
        sync: false
      - key: HUGGINGFACE_API_TOKEN
        sync: false
